title: "Chinese Cultural Revolution"
date: "1966-05"
date_end: "1976-10"
date_display: "1966–1976"
approximate: false

summary: >
  Launched by Mao Zedong in May 1966, the Cultural Revolution was a decade of
  violent political and social upheaval aimed at purging "bourgeois" elements
  from Chinese society. Red Guards destroyed cultural artefacts, persecuted
  intellectuals, and attacked "counter-revolutionaries," causing the deaths of
  hundreds of thousands to two million people.

body: |
  The Cultural Revolution emerged from Mao Zedong's desire to reassert his
  authority following the catastrophic Great Leap Forward. Mao mobilised young
  students — the Red Guards — who attacked teachers, officials, and anyone
  perceived as insufficiently revolutionary. Schools and universities were shut,
  intellectuals were sent to rural "re-education" camps, and religious sites
  and historical monuments were destroyed.

  Factional violence between rival Red Guard factions killed thousands. The
  People's Liberation Army eventually intervened to restore order. The most
  radical phase (1966–1969) gave way to a more controlled but still repressive
  period until Mao's death in September 1976. The Gang of Four, led by Mao's
  wife Jiang Qing, were arrested weeks later.

  The Chinese Communist Party officially assessed the Cultural Revolution in
  1981 as a "severe setback and loss for the Party and the people," attributing
  primary responsibility to Mao while preserving his overall legacy. Historians
  estimate 1–2 million direct deaths, with tens of millions more subjected to
  forced labour, imprisonment, and persecution.

